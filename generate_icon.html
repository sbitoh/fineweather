<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; background: transparent; }
  .icon {
    width: 512px;
    height: 512px;
    border-radius: 115px;
    background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #030712 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div class="icon">
    <svg width="400" height="400" viewBox="0 0 100 100">
      <!-- 破晓金阳 -->
      <circle cx="50" cy="50" r="15" fill="#fbbf24" filter="url(#glow)"/>
      <!-- 流光破晓光弧 -->
      <path d="M15,75 Q50,25 85,75" fill="none" stroke="url(#arcSun)" stroke-width="7" stroke-linecap="round"/>
      <defs>
        <linearGradient id="arcSun" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="50%" stop-color="#fb923c"/>
          <stop offset="100%" stop-color="#facc15"/>
        </linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.9"/>
        </filter>
      </defs>
    </svg>
  </div>
</body>
</html>
